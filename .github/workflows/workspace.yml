name: OpenMontage Cloud Workspace

on:
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenMontage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg make tmate
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start tmate in background
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "Connect via SSH: $(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')" > connection-info.txt
          echo "Connect via Web: $(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')" >> connection-info.txt
          cat connection-info.txt

      - name: Upload Connection Info
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: connection-info.txt

      - name: Keep Alive
        run: sleep 21600
