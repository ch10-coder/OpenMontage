name: OpenMontage Cloud Workspace

on:
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenMontage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg make
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup SSH Workspace (tmate)
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Save Connection Info
        run: |
          echo "Connect via SSH: ${{ steps.tmate.outputs.ssh-command }}" > connection-info.txt
          echo "Connect via Web: ${{ steps.tmate.outputs.web-url }}" >> connection-info.txt

      - name: Upload Connection Info
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: connection-info.txt

      - name: Keep Alive
        run: sleep 21600
